<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>welcome to login page</title>
    <link rel="icon" href="https://www.citypng.com/public/uploads/preview/hd-flipkart-round-logo-icon-transparent-png-701751694966204grvmunpzzf.png?v=2026072917">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <form action="" method="get">
        <label for="un">Username<sup class="starMark">*</sup></label>
        <input type="text" id="un" name="username" required minlength="5" maxlength="10"
            value="yash dangar" readonly>  <br><br>
        <label for="pwd">Password<sup class="starMark">*</sup></label>
        <input type="password" id="pwd" name="password" required pattern="[A-Z,a-z]{6,12}"> <!--database table column name--> <br><br>
        <br><br>
        <input type="range" min="30" max="90" value="70">
        <br><br>
        <button type="submit">Login</button>
        <button type="reset">cancel</button>
    </form>
    <p>Don't have an account? <a href="register.html">click here up</a></p>
</body>
</html>
