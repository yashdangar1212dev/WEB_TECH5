<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form>
        <label for="un">Username:</label>
        <input type="text" id="un" name="username">  <br><br>
        <label for="pwd">Password:</label>  
        <input type="password" id="pwd" name="password"> <br><br>
        <label for="email">Email:</label>
        <input type="email" id="email" name="email"> <br><br>
        <label for="tel">Mobile:</label>
        <input type="tel" id="tel" name="mobile"> <br><br>
        <label for="number">Age:</label>
        <input type="number" id="age" name="age"> <br><br>
        <label for="dob">Date of Birth:</label>
        <input type="date" id="dob" name="date_of_birth"> <br><br>
        <label for="dtl">Date and Time:</label>
        <input type="datetime-local" id="dtl" name="date_time"> <br><br>
        <label for="file">Upload File:</label>
        <input type="file" id="file" name="file_upload"> <br><br>
        <label for="gender">Gender:</label>
        <input type="radio" id="male" name="gender" value="male"> male
        <input type="radio" id="female" name="gender" value="female">female <br><br>
        <label for="hobbies">Hobbies:</label>
        <input type="checkbox" id="hobby1" name="hobbies" value="reading"> Reading
        <input type="checkbox" id="hobby2" name="hobbies" value="traveling"> Traveling
        <input type="checkbox" id="hobby3" name="hobbies" value="sports"> Sports <br><br>
        <label for="search">Search:</label>
        <input type="search" id="search" name="search"> <br><br>
        <label for="url">Website:</label>
        <input type="url" id="url" name="website"> <br><br>
        <label for="color">Favorite Color:</label>
        <input type="color" id="color" name="favorite_color"> <br><br>

        <button type="submit">Submit</button>
        <button type="reset">Reset</button>
    </form>
</body>
</html>
